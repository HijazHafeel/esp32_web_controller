<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 Robot Controller</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      text-align: center; 
      background: #0f172a; 
      color: #fff; 
      margin: 0; 
      padding: 20px; 
      user-select: none;
      -webkit-user-select: none;
    }
    h2 { color: #38bdf8; margin-bottom: 10px; }
    #status { font-weight: bold; margin-bottom: 20px; }
    .online { color: #4ade80; }
    .offline { color: #f87171; }

    .joystick-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 85px); 
      grid-template-rows: repeat(3, 85px); 
      gap: 12px; 
      justify-content: center; 
      margin: 20px auto; 
    }
    .btn { 
      background: #1e293b; 
      border: 2px solid #38bdf8; 
      color: #38bdf8; 
      font-size: 28px; 
      font-weight: bold; 
      border-radius: 16px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      touch-action: manipulation;
    }
    .btn:active { 
      background: #38bdf8; 
      color: #0f172a; 
      transform: scale(0.95); 
    }
    .btn-stop { 
      border-color: #ef4444; 
      color: #ef4444; 
    }
    .btn-stop:active { 
      background: #ef4444; 
      color: #fff; 
    }
    .slider-container { 
      margin: 20px auto; 
      max-width: 280px; 
      background: #1e293b; 
      padding: 15px; 
      border-radius: 12px; 
    }
    input[type=range] { 
      width: 100%; 
      accent-color: #38bdf8; 
      margin-top: 10px; 
    }
  </style>
</head>
<body>
  <h2>ESP32 Robot Controller</h2>
  <div id="status" class="offline">Status: Disconnected</div>

  <div class="joystick-grid">
    <div></div>
    <!-- Forward -->
    <div class="btn" onmousedown="sendCmd('F')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('F')" ontouchend="sendCmd('S')">&#9650;</div>
    <div></div>

    <!-- Left -->
    <div class="btn" onmousedown="sendCmd('L')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('L')" ontouchend="sendCmd('S')">&#9664;</div>

    <!-- Stop -->
    <div class="btn btn-stop" onclick="sendCmd('S')">&#9632;</div>

    <!-- Right -->
    <div class="btn" onmousedown="sendCmd('R')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('R')" ontouchend="sendCmd('S')">&#9654;</div>
    <div></div>

    <!-- Backward -->
    <div class="btn" onmousedown="sendCmd('B')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('B')" ontouchend="sendCmd('S')">&#9660;</div>
    <div></div>
  </div>

  <!-- Speed Control Slider -->
  <div class="slider-container">
    <label>Speed PWM: <span id="speedVal">200</span></label><br>
    <input type="range" min="100" max="255" value="200" oninput="updateSpeed(this.value)">
  </div>

  <script>
    const ws = new WebSocket('ws://192.168.1.100:81');
    const statusEl = document.getElementById('status');

    ws.onopen = () => {
      statusEl.innerText = "Status: Connected";
      statusEl.className = "online";
    };

    ws.onclose = () => {
      statusEl.innerText = "Status: Disconnected";
      statusEl.className = "offline";
    };

    function sendCmd(cmd) {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(cmd);
      }
    }

    function updateSpeed(val) {
      document.getElementById('speedVal').innerText = val;
      if (ws.readyState === WebSocket.OPEN) {
        ws.send("PWM:" + val);
      }
    }
  </script>
</body>
</html>
